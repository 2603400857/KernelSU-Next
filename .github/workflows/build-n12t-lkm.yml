name: Build LKM for Redmi Note12Turbo
on:
  workflow_dispatch:
    inputs:
      kmi:
        description: KMI
        required: true
        default: 5.10.236-android12-9-00003-gfb24cf99ad97

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ github.event.inputs.kmi }}
      options: --privileged
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build ko
        run: make KDIR=$KERNEL_SRC
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.kmi }}-module
          path: '*.ko'
